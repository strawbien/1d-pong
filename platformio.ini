; PlatformIO Project Configuration File
; 1D-Pong for WEMOS D1 mini ESP32

; Fork : ESP32 DevKit V1 30 broches par défaut
[platformio]
default_envs = esp32dev

; Réglages communs à tous les environnements
[env]
; Versions figées : le code d'origine utilise l'API ledc du core Arduino 2.x
platform = espressif32@~6.9.0
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps =
    fastled/FastLED@~3.7.8

; Build flags
build_flags =
    -D CONFIG_FREERTOS_HZ=1000

[env:wemos_d1_mini32]
board = wemos_d1_mini32

; ESP32 DevKit V1 30 broches (V1 du fork)
[env:esp32dev]
board = esp32dev

; Mode test matériel : LEDs fixes + état des boutons sur le port série
[env:esp32dev_test]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D HW_TEST
